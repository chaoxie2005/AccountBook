<style>
  .navbar {
    background: #fff !important;
    border-bottom: 1px solid #e3e6f0;
    padding: 0.75rem 1.5rem;
  }

  .navbar-brand {
    color: #4e73df !important;
    font-weight: 800;
    letter-spacing: 0.05rem;
    background-color: transparent !important;
    box-shadow: none !important;
  }

  .user-profile-area {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .header-avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 2px solid #e3e6f0;
    transition: all 0.2s ease;
    cursor: pointer;
  }

  .header-avatar:hover {
    transform: scale(1.1);
    border-color: #4e73df;
  }

  .username-link {
    color: #5a5c69;
    font-weight: 600;
    text-decoration: none !important;
  }

  .username-link:hover {
    color: #4e73df;
  }

  .logout-btn {
    background: #f8f9fc;
    border: 1px solid #e3e6f0;
    border-radius: 0.35rem;
    padding: 0.4rem 0.8rem;
    color: #e74a3b;
    font-weight: 600;
    font-size: 0.85rem;
    text-decoration: none !important;
    transition: all 0.2s ease;
  }

  .logout-btn:hover {
    background: #e74a3b;
    color: #fff;
    border-color: #e74a3b;
  }
</style>

<nav class="navbar navbar-expand navbar-light sticky-top shadow-sm">
  <a class="navbar-brand" href="/">
    <i class="fas fa-wallet mr-2"></i>超凡账本
  </a>

  <ul class="navbar-nav ml-auto">
    <div class="user-profile-area">
      <div class="d-none d-lg-inline text-gray-600 small mr-2">
        <span class="username-link">{{ request.user.username }}</span>
      </div>
      <a href="javascript:void(0);" data-toggle="modal" data-target="#avatarModal" title="点击预览头像">
        <img class="header-avatar" src="/media/{{ request.user.userinfo.avatar }}" alt="头像" />
      </a>
      <div class="topbar-divider d-none d-sm-block"
        style="width: 0; border-right: 1px solid #e3e6f0; height: 2.5rem; margin: auto 1rem;"></div>
      <a class="logout-btn" href="{% url 'authentication:logout' %}">
        <i class="fas fa-sign-out-alt mr-1"></i>退出
      </a>
    </div>
  </ul>
</nav>
