{% extends 'superclass/base_auth.html' %}

{% block style %}
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/authentication/register.css' %}">
{%  endblock %}

{% block content %}
  <div class="card shadow-lg">
    <div class="card-body">
      <h5 class="card-title text-center py-3">注册</h5>
      <form action="{% url 'authentication:register' %}" method="post">
        {% csrf_token %}
        <div class="form-group inPutZone">
          <img src="{% static 'img/authentication/account.svg' %}">
          <input type="email" class="form-control" placeholder="用户名" autocomplete="off"/>
        </div>
        <div class="form-group inPutZone">
          <img src="{% static 'img/authentication/email.svg' %}">
          <input type="email" class="form-control" placeholder="请输入您的邮箱" autocomplete="off"/>
        </div>
        <div class="form-group inPutZone">
          <img src="{% static 'img/authentication/lock.svg' %}">
          <input type="password" class="form-control" placeholder="密码" autocomplete="off"/>
        </div>
        <div class="form-group inPutZone">
          <img src="{% static 'img/authentication/lock.svg' %}">
          <input type="password" class="form-control" placeholder="确认密码" autocomplete="off"/>
        </div>
        <div class="text-center">
            <button type="submit" class="btn btn-primary">注册</button>
        </div>
        <p id="privacy">注册即表示同意遵守 <a href="">用户协议</a> 与 <a href="">隐私政策</a></p>
        <p id='gotologin'>已有账户, <a href="#">立即登录</a></p>
      </form>
    </div>
  </div>
{% endblock %}
