{% extends 'superclass/base.html' %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-xl-6 col-lg-8">
      <div class="d-sm-flex align-items-center justify-content-between mb-4">
        <h1 class="h3 mb-0 text-gray-800"><i class="fas fa-user-circle mr-2 text-primary"></i>个人头像</h1>
      </div>

      <div class="card shadow mb-4 text-center">
        <div class="card-header py-3">
          <h6 class="m-0 font-weight-bold text-primary">上传新头像</h6>
        </div>
        <div class="card-body py-5">
          <div class="mb-4">
            <img src="/media/{{ request.user.userinfo.avatar }}" alt="预览" id="preview" class="rounded-circle shadow-sm border" style="width: 150px; height: 150px; object-fit: cover;">
          </div>
          
          <form action="{% url 'authentication:upload_avatar' %}" method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="custom-file mb-4 text-left" style="max-width: 300px; margin: 0 auto;">
              <input type="file" class="custom-file-input" id="avatar" name="avatar" accept="image/*" required>
              <label class="custom-file-label" for="avatar">选择图片...</label>
            </div>
            
            <div>
              <button type="submit" class="btn btn-primary px-5 shadow-sm">
                <i class="fas fa-upload mr-2"></i> 保存头像
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}

{% block js %}
<script>
    const avatarInput = document.querySelector('#avatar')
    const previewImg = document.querySelector('#preview')
    const label = document.querySelector('.custom-file-label')

    avatarInput.addEventListener('change', function(){
        const file = this.files[0];
        if (file) {
            label.textContent = file.name;
            const reader = new FileReader();
            reader.addEventListener('load', function(){
                previewImg.src = reader.result;
            })
            reader.readAsDataURL(file);
        }
    })
</script>
{% endblock %}
