{% extends 'superclass/base_auth.html' %}

{% block style %}
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/authentication/login.css' %}">
    <style>
     #verify-code {
        cursor: pointer;
        width: 100px;
        height: 38px;
        border-radius: 5px;
        top: 0px;
        left: 0px;
    </style>
{%  endblock %}

{% block content %}
  <div class="card auth-card shadow">
    <div class="auth-header">
      <h3 class="font-weight-bold text-primary mb-0"><i class="fas fa-wallet mr-2"></i>登录</h3>
      <p class="text-muted small mt-2">欢迎回来，请登录您的账户</p>
    </div>
    <div class="auth-body">
      <form action="{% url 'authentication:login' %}" method="post">
        {% csrf_token %}
        {% include "part/messages.html" %}
        {% include "part/errors.html" %}
        
        <div class="form-group">
          <label class="small font-weight-bold text-dark">用户名</label>
          <div class="input-group">
            <div class="input-group-prepend">
              <span class="input-group-text bg-light border-right-0"><i class="fas fa-user text-gray-400"></i></span>
            </div>
            <input type="text" class="form-control bg-light border-left-0 {% if form.username.errors %}is-invalid{% endif %}" name="username" placeholder="请输入用户名" id="username" autocomplete="off" value="{{ values.username }}"/>
          </div>
        </div>

        <div class="form-group">
          <label class="small font-weight-bold text-dark">密码</label>
          <div class="input-group">
            <div class="input-group-prepend">
              <span class="input-group-text bg-light border-right-0"><i class="fas fa-lock text-gray-400"></i></span>
            </div>
            <input type="password" class="form-control bg-light border-left-0 {% if form.password.errors %}is-invalid{% endif %}" name="password" placeholder="请输入密码" id="password" autocomplete="off" value="{{ values.password }}" />
            <div class="input-group-append">
              <span class="input-group-text bg-light border-left-0" style="cursor: pointer;" id="toggle-password">
                <i class="fas fa-eye text-gray-400" id="password-icon"></i>
              </span>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label class="small font-weight-bold text-dark">验证码</label>
          <div class="row">
            <div class="col-7">
              <input type="text" name="captcha" placeholder="请输入验证码" class="form-control bg-light {% if form.captcha.errors %}is-invalid{% endif %}" autocomplete="off"/>
            </div>
            <div class="col-5">
              <img src="{% url 'authentication:captcha' %}" alt="验证码" id="verify-code" class="img-fluid rounded border" style="height: 45px; cursor: pointer;">
            </div>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-auth mt-4">
          <i class="fas fa-sign-in-alt mr-2"></i> 立即登录
        </button>
        
        <hr class="my-4">
        
        <div class="text-center small">
          <a href="{% url 'authentication:register' %}" class="text-primary font-weight-bold">立即注册</a>
          <span class="text-gray-400 mx-2">|</span>
          <a href="{% url 'authentication:forget_password' %}" class="text-muted">忘记密码?</a>
        </div>
      </form>
    </div>
  </div>
{% endblock %}


{% block js %}
    <script src="{% static 'js/authentication/login.js' %}"></script>
{% endblock  %}
