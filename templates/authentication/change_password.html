{% extends 'superclass/base.html' %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-xl-6 col-lg-8">
      <div class="d-sm-flex align-items-center justify-content-between mb-4">
        <h1 class="h3 mb-0 text-gray-800"><i class="fas fa-key mr-2 text-primary"></i>修改密码</h1>
      </div>

      <div class="card shadow mb-4">
        <div class="card-header py-3">
          <h6 class="m-0 font-weight-bold text-primary">安全设置</h6>
        </div>
        <div class="card-body">
          <form action="{% url 'authentication:change_password' %}" method="post">
            {% csrf_token %}
            <div class="form-group">
              <label class="small font-weight-bold text-dark">当前密码</label>
              <div class="input-group">
                <div class="input-group-prepend">
                  <span class="input-group-text bg-light border-0"><i class="fas fa-lock text-gray-400"></i></span>
                </div>
                <input type="password" name="old-password" class="form-control bg-light border-0" placeholder="请输入旧密码" required />
              </div>
            </div>
            
            <hr class="my-4">

            <div class="form-group">
              <label class="small font-weight-bold text-dark">新密码</label>
              <div class="input-group">
                <div class="input-group-prepend">
                  <span class="input-group-text bg-light border-0"><i class="fas fa-key text-gray-400"></i></span>
                </div>
                <input type="password" name="new-password" class="form-control bg-light border-0" placeholder="请输入 6-20 位新密码" required />
              </div>
            </div>

            <div class="form-group">
              <label class="small font-weight-bold text-dark">确认新密码</label>
              <div class="input-group">
                <div class="input-group-prepend">
                  <span class="input-group-text bg-light border-0"><i class="fas fa-shield-alt text-gray-400"></i></span>
                </div>
                <input type="password" name="re-password" class="form-control bg-light border-0" placeholder="请再次输入新密码" required />
              </div>
            </div>

            <div class="text-right mt-4">
              <button type="submit" class="btn btn-primary px-5 shadow-sm">
                <i class="fas fa-check mr-2"></i> 修改密码
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
